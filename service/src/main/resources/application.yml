spring:
  application:
    name: execution-reports-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:execution_reports}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
    consumer:
      group-id: execution-reports-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.maxcapital.executionreports.domain"
        spring.json.value.default.type: "com.maxcapital.executionreports.domain.ExecutionReport"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true

app:
  kafka:
    topics:
      execution-reports: execution-reports
      execution-reports-dlq: execution-reports.dlq
      settlement: settlement

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, info
      base-path: /
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.maxcapital: DEBUG
    org.apache.kafka: WARN
